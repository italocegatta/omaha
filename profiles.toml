# profiles.toml — per-session model/provider/effort overrides for OpenCode agents.
#
# Resolution chain (highest priority first):
#   1. CLI `--profile <name>`
#   2. Env var `OPENCODE_PROFILE`
#   3. This file's [default] profile (below)
#   4. Built-in default: `xiaomi-balanced`
#
# Available profiles:
#   openai-cheap           — all roles gpt-5.4-mini, high effort (cheapest OpenAI)
#   openai-balanced        — heavy roles gpt-5.4, light roles gpt-5.4-mini (← active)
#   openai-xiaomi-balanced — OpenAI routing, Xiaomi execution, mixed effort
#   xiaomi-balanced        — all roles Xiaomi mimo models, medium effort
#
# Each profile sets 7 roles: roadmap, propose, apply, review, finalize, explore, slice.
# TOML overrides merge on top of built-in profiles — define only roles you want to change.
#
# Usage:
#   uv run task agent-profile                          # uses [default] profile below
#   uv run task agent-profile -- --profile openai-cheap
#   uv run task agent-profile -- --list-profiles
# (`oc` is a backward-compatible alias for `agent-profile`)

[default]
profile = "xiaomi-balanced"

# ── openai-cheap ──────────────────────────────────────────────────────────────
[profiles.openai-cheap.roadmap]
provider = "openai"
model = "gpt-5.6-luna"
effort = "high"

